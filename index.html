<style>
:root{--paper:#f4f1e9;--ink:#20251f;--muted:#777c71;--line:#d9d7cc;--lime:#c8fa64;--orange:#ed7453;--violet:#8272df;--white:#fffef9;--mono:'DM Mono',monospace;--sans:'DM Sans',sans-serif;--display:'Space Grotesk',sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.shell{min-height:100vh;display:grid;grid-template-columns:236px 1fr}.rail{background:#e9e7dc;border-right:1px solid var(--line);padding:24px 17px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:10px;padding:0 9px 36px}.mark{width:29px;height:29px;background:var(--ink);color:var(--lime);display:grid;place-items:center;border-radius:9px;font:700 16px var(--display);transform:rotate(-7deg)}.brand b{font:700 19px var(--display);letter-spacing:-1px}.brand small{font:10px var(--mono);color:var(--muted);margin-left:auto}.navlabel{font:10px var(--mono);color:#96968a;letter-spacing:1.3px;padding:0 11px;margin:13px 0 8px}.nav button{width:100%;display:flex;align-items:center;gap:12px;padding:11px;border:0;background:transparent;text-align:left;color:#686e64;border-radius:9px;font-size:13px;margin:2px 0}.nav button:hover,.nav button.active{background:var(--white);color:var(--ink)}.nav button.active{font-weight:700}.nav .ico{width:17px;text-align:center;font-size:16px}.nav .count{margin-left:auto;font:10px var(--mono);background:var(--lime);padding:3px 6px;border-radius:99px;color:var(--ink)}.profile{margin-top:auto;border-top:1px solid var(--line);padding:17px 7px 3px;display:flex;align-items:center;gap:10px}.avatar{height:34px;width:34px;border-radius:50%;background:#d6c8f2;display:grid;place-items:center;font:600 11px var(--mono)}.profile b{font-size:12px}.profile small{display:block;color:var(--muted);font:10px var(--mono);margin-top:3px}.main{min-width:0}.top{height:66px;border-bottom:1px solid var(--line);padding:0 38px;display:flex;align-items:center;justify-content:space-between}.crumb{font:11px var(--mono);color:var(--muted)}.topright{display:flex;align-items:center;gap:18px}.live{font:10px var(--mono);display:flex;align-items:center;gap:7px;color:var(--muted)}.live i{width:7px;height:7px;border-radius:50%;background:#78b742;box-shadow:0 0 0 4px #78b74222}.content{max-width:1380px;margin:0 auto;padding:36px 42px 60px}.eyebrow{font:10px var(--mono);color:var(--muted);letter-spacing:1.1px;text-transform:uppercase}.headrow{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:25px}.headrow h1{font:600 clamp(30px,4vw,43px)/1.05 var(--display);letter-spacing:-2px;margin:9px 0 0}.headrow p{color:var(--muted);margin:9px 0 0}.button{border:0;border-radius:7px;padding:11px 16px;font-size:12px;font-weight:700;background:var(--ink);color:var(--white);transition:.2s;display:inline-flex;align-items:center;gap:8px}.button:hover{transform:translateY(-2px);box-shadow:0 5px 0 #20251f22}.button.lime{background:var(--lime);color:var(--ink)}.button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}.button.small{padding:8px 11px;font-size:11px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--white)}.metric{padding:19px 20px;border-right:1px solid var(--line)}.metric:last-child{border:0}.metric .label{font:10px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.6px}.metric strong{display:block;font:600 30px var(--display);letter-spacing:-1px;margin:9px 0 2px}.metric small{font-size:11px;color:var(--muted)}.metric small em{color:#52882b;font-style:normal;font-weight:700}.grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(245px,.8fr);gap:18px;margin-top:19px}.panel{border:1px solid var(--line);border-radius:11px;background:var(--white);overflow:hidden}.panelhead{padding:17px 19px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.panelhead h2{font:600 15px var(--display);margin:0;letter-spacing:-.3px}.mono{font:10px var(--mono);color:var(--muted)}.challenge{padding:16px 19px;border-bottom:1px solid #eeece5;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.challenge:last-child{border:0}.tag{display:inline-flex;font:9px var(--mono);letter-spacing:.4px;padding:5px 8px;border-radius:99px;background:#edeaf8;color:#6353ba;text-transform:uppercase}.tag.green{background:#ecf4df;color:#597c30}.tag.orange{background:#fbe9e2;color:#ac563d}.challenge h3{font:600 16px var(--display);margin:9px 0 5px;letter-spacing:-.5px}.challenge p{margin:0;font-size:11px;color:var(--muted)}.challengemeta{text-align:right;min-width:100px}.challengemeta strong{font:500 17px var(--display)}.challengemeta small{display:block;color:var(--muted);font:10px var(--mono);margin:4px 0 8px}.rankrow{display:grid;grid-template-columns:27px 1fr auto;align-items:center;gap:10px;padding:14px 19px;border-bottom:1px solid #eeece5}.rankrow:last-child{border:0}.rank{font:12px var(--mono);color:#a1a194}.rank.first{color:#b88a22}.rankrow b{font-size:12px}.rankrow small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.score{font:12px var(--mono)}.activity{display:flex;gap:11px;padding:12px 19px;border-bottom:1px solid #eeece5;font-size:11px}.activity:last-child{border:0}.dot{width:7px;height:7px;background:var(--violet);border-radius:50%;margin-top:4px;flex:none}.activity time{display:block;font:9px var(--mono);color:var(--muted);margin-top:4px}.toolbar{display:flex;gap:9px;align-items:center;margin:18px 0}.field{border:1px solid var(--line);background:var(--white);border-radius:7px;padding:10px 12px;outline:none;color:var(--ink);min-width:0}.field:focus{border-color:var(--violet);box-shadow:0 0 0 3px #8272df20}.toolbar .field{font-size:12px}.search{flex:1}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.challengecard{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:19px;display:flex;flex-direction:column;min-height:224px;transition:.2s}.challengecard:hover{transform:translateY(-3px);box-shadow:0 8px 20px #20251f0b}.challengecard h3{font:600 19px var(--display);letter-spacing:-.7px;margin:13px 0 7px}.challengecard p{font-size:12px;line-height:1.6;color:var(--muted);margin:0}.cardfoot{margin-top:auto;padding-top:18px;display:flex;align-items:center;justify-content:space-between}.cardfoot small{font:10px var(--mono);color:var(--muted)}.table{width:100%;border-collapse:collapse}.table th{text-align:left;padding:11px 17px;font:9px var(--mono);color:var(--muted);letter-spacing:.7px;text-transform:uppercase;background:#f7f6f0}.table td{padding:13px 17px;border-top:1px solid #eeece5;font-size:11px}.table td:first-child{font-weight:600}.status{font:9px var(--mono);padding:5px 8px;border-radius:20px;background:#f1efea;color:#74776f}.status.review{background:#edeaf8;color:#6353ba}.status.finalist{background:#ecf4df;color:#597c30}.bar{height:5px;border-radius:9px;background:#eeece5;overflow:hidden;min-width:60px}.bar i{height:100%;display:block;background:var(--violet);border-radius:9px}.empty{padding:40px;text-align:center;color:var(--muted)}.modalback{position:fixed;inset:0;background:#171a17a6;z-index:10;display:grid;place-items:center;padding:18px}.modal{width:min(560px,100%);background:var(--paper);border-radius:13px;padding:25px;max-height:90vh;overflow:auto;box-shadow:0 25px 80px #0004}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.modalhead h2{font:600 24px var(--display);margin:0;letter-spacing:-1px}.close{border:0;background:transparent;font-size:23px;color:var(--muted)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.formgroup{display:flex;flex-direction:column;gap:6px}.formgroup.full{grid-column:1/-1}.formgroup label{font:10px var(--mono);color:var(--muted);text-transform:uppercase}.formgroup .field{width:100%}textarea.field{resize:vertical;min-height:85px}.toast{position:fixed;bottom:22px;right:22px;background:var(--ink);color:white;padding:13px 18px;border-radius:8px;font-size:12px;z-index:20;animation:up .25s}@keyframes up{from{transform:translateY(12px);opacity:0}to{opacity:1}}.view{animation:fade .3s}@keyframes fade{from{opacity:.3;transform:translateY(4px)}to{opacity:1;transform:none}}.hamb{display:none;border:0;background:none;font-size:20px}.sectiontitle{font:600 18px var(--display);margin:25px 0 12px}.weighted{display:grid;gap:10px;padding:18px}.weightrow{display:grid;grid-template-columns:1fr 2fr 35px;gap:12px;align-items:center;font-size:11px}.weightrow .bar i{background:var(--orange)}.navhide{display:none!important}
@media(max-width:900px){.shell{grid-template-columns:190px 1fr}.rail{padding:20px 10px}.content{padding:28px 23px}.top{padding:0 23px}.grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.metric:nth-child(2){border-right:0}.metric:nth-child(-n+2){border-bottom:1px solid var(--line)}}@media(max-width:620px){.shell{display:block}.rail{display:none;position:fixed;z-index:8;left:0;top:0;width:245px;box-shadow:10px 0 40px #0002}.rail.open{display:flex}.top{height:58px;padding:0 17px}.hamb{display:block}.content{padding:24px 16px 45px}.headrow{align-items:flex-start;gap:12px}.headrow h1{font-size:33px}.headrow>.button{margin-top:8px;padding:10px}.headrow>.button span{display:none}.metrics{grid-template-columns:repeat(2,1fr)}.metric{padding:15px}.metric strong{font-size:25px}.cards{grid-template-columns:1fr}.toolbar{flex-wrap:wrap}.toolbar .search{flex-basis:100%;order:-1}.formgrid{grid-template-columns:1fr}.formgroup.full{grid-column:auto}.tablewrap{overflow:auto}.table{min-width:540px}.live{display:none}}
</style></head><body><div id="app"></div><script>
const seed={challenges:[{id:1,title:'The Circular City Challenge',category:'Sustainability',status:'Open',description:'Reimagine the way our cities use, reuse and regenerate resources. Build a future that leaves nothing behind.',deadline:'2026-12-18',participants:128,prize:'₹1,50,000',criteria:[['Innovation',30],['Feasibility',20],['Technical Implementation',20],['Problem Solving',15],['Potential Impact',15]]},{id:2,title:'AI for Everyday Health',category:'Healthcare',status:'Open',description:'Make preventive care more personal, accessible and human through thoughtful applications of artificial intelligence.',deadline:'2026-12-04',participants:84,prize:'₹1,00,000',criteria:[['Innovation',30],['Feasibility',20],['Technical Implementation',20],['Problem Solving',15],['Potential Impact',15]]},{id:3,title:'Fintech for All',category:'Finance',status:'Open',description:'Design inclusive financial tools that give every community a fair shot at building a secure future.',deadline:'2027-01-10',participants:63,prize:'₹75,000',criteria:[['Innovation',30],['Feasibility',20],['Technical Implementation',20],['Problem Solving',15],['Potential Impact',15]]},{id:4,title:'Learning Without Limits',category:'Education',status:'Coming soon',description:'Open up new paths to learning with tools that meet every student where they are.',deadline:'2027-01-30',participants:0,prize:'₹50,000',criteria:[['Innovation',30],['Feasibility',20],['Technical Implementation',20],['Problem Solving',15],['Potential Impact',15]]}],users:[{name:'Aarav Mehta',role:'Participant',email:'aarav@demo.com'},{name:'Maya Iyer',role:'Participant',email:'maya@demo.com'},{name:'Kabir Shah',role:'Participant',email:'kabir@demo.com'},{name:'Riya Nair',role:'Participant',email:'riya@demo.com'},{name:'Dev Patel',role:'Participant',email:'dev@demo.com'},{name:'Dr. Anika Bose',role:'Reviewer',email:'anika@demo.com'},{name:'Rohan Kulkarni',role:'Reviewer',email:'rohan@demo.com'}],proposals:[{id:11,title:'ReThread',team:'Aarav Mehta',challenge:'The Circular City Challenge',status:'Finalist',score:9.2,innovation:'A neighborhood textile exchange using smart lockers and material passports.',solution:'We turn discarded clothing into a local circular economy.'},{id:12,title:'PulsePath',team:'Maya Iyer',challenge:'AI for Everyday Health',status:'Under review',score:8.8,innovation:'An offline-first health companion that spots patterns before symptoms become serious.',solution:'A low-cost triage and prevention tool for rural clinics.'},{id:13,title:'Loop Local',team:'Kabir Shah',challenge:'The Circular City Challenge',status:'Under review',score:8.5,innovation:'A citywide marketplace for surplus construction materials.',solution:'Connects demolition sites with builders who need reclaimed supplies.'},{id:14,title:'Pocket Seed',team:'Riya Nair',challenge:'Fintech for All',status:'Submitted',score:8.1,innovation:'A savings app that rounds up purchases for community goals.',solution:'Makes group saving simple and transparent.'},{id:15,title:'OpenBench',team:'Dev Patel',challenge:'The Circular City Challenge',status:'Under review',score:7.9,innovation:'A repair map that connects people to local fixers and shared tools.',solution:'A searchable map for repair skills and equipment.'},{id:16,title:'QuietMind',team:'Tara Singh',challenge:'AI for Everyday Health',status:'Submitted',score:7.6,innovation:'A voice-first wellbeing check-in for people who live alone.',solution:'Gentle daily check-ins with opt-in human support.'}],reviews:[]};let db=JSON.parse(localStorage.getItem('innovatex_db')||'null')||seed;const save=()=>localStorage.setItem('innovatex_db',JSON.stringify(db));let user=JSON.parse(sessionStorage.getItem('innovatex_user')||'null')||{name:'Alex Morgan',role:'Administrator',email:'admin@demo.com'};let page='Overview',filter='All',query='';const app=document.getElementById('app');const initials=n=>n.split(' ').map(x=>x[0]).slice(0,2).join('');function toast(s){let t=document.createElement('div');t.className='toast';t.textContent=s;document.body.append(t);setTimeout(()=>t.remove(),2800)}function navBtn(p,icon,count=''){return `<button class="${page===p?'active':''}" onclick="go('${p}')"><span class="ico">${icon}</span>${p}${count?`<span class="count">${count}</span>`:''}</button>`}function go(p){page=p;document.querySelector('.rail')?.classList.remove('open');render()}function shell(inner){return `<div class="shell"><aside class="rail"><div class="brand"><span class="mark">✳</span><b>innovatex</b><small>v1.0</small></div><nav class="nav"><div class="navlabel">WORKSPACE</div>${navBtn('Overview','◫')}${navBtn('Challenges','◇',db.challenges.filter(c=>c.status==='Open').length)}${navBtn('Submissions','▤')}${navBtn('Reviews','✳',db.proposals.filter(p=>p.status==='Under review').length)}${navBtn('Leaderboard','↗')}${navBtn('Results','◎')}<div class="navlabel">ACCOUNT</div>${navBtn('Team','♧')}${navBtn('Settings','⚙')}</nav><div class="profile"><div class="avatar">${initials(user.name)}</div><div><b>${user.name}</b><small>${user.role}</small></div><button class="close" style="margin-left:auto;font-size:15px" title="Sign out" onclick="logout()">↗</button></div></aside><main class="main"><header class="top"><div><button class="hamb" onclick="document.querySelector('.rail').classList.toggle('open')">☰</button><span class="crumb">Workspace&nbsp; / &nbsp;${page}</span></div><div class="topright"><span class="live"><i></i> SYSTEM OPERATIONAL</span><span class="mono">06 NOV 2026</span></div></header><section class="content view">${inner}</section></main></div>`}function head(eyebrow,title,desc,action=''){return `<div class="headrow"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1>${desc?`<p>${desc}</p>`:''}</div>${action}</div>`}function met(label,val,desc){return `<div class="metric"><div class="label">${label}</div><strong>${val}</strong><small>${desc}</small></div>`}function card(c){return `<article class="challengecard"><div><span class="tag ${c.category==='Sustainability'?'green':''}">${c.category}</span><span class="mono" style="float:right">${c.status.toUpperCase()}</span></div><h3>${c.title}</h3><p>${c.description}</p><div class="cardfoot"><small>◷ ${new Date(c.deadline+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short'})} &nbsp;·&nbsp; ${c.participants} participants</small><button class="button small" onclick='join(${JSON.stringify(c.id)})'>${user.role==='Administrator'?'Manage':user.role==='Reviewer'?'View':'Join challenge'} ↗</button></div></article>`}function overview(){let pending=db.proposals.filter(p=>p.status==='Under review').length;return head('FRIDAY, 06 NOVEMBER 2026','Ideas, in motion.','A little progress today makes a big difference tomorrow.','<button class="button lime" onclick="modalChallenge()">＋ <span>New challenge</span></button>')+`<div class="metrics">${met('Active challenges',db.challenges.filter(c=>c.status==='Open').length,'<em>↑ 2</em> since last month')}${met('Participants',db.users.filter(u=>u.role==='Participant').length+268,'<em>↑ 18%</em> this month')}${met('Submissions',db.proposals.length,'Across all challenges')}${met('Reviews pending',pending,'<em>Needs attention</em>')}</div><div class="grid"><div class="panel"><div class="panelhead"><h2>Challenges in the wild</h2><button class="button ghost small" onclick="go('Challenges')">View all ↗</button></div>${db.challenges.slice(0,3).map(c=>`<div class="challenge"><div><span class="tag ${c.category==='Sustainability'?'green':''}">${c.category}</span><h3>${c.title}</h3><p>◷ Deadline ${new Date(c.deadline+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short'})} &nbsp;·&nbsp; ${c.participants} participants</p></div><div class="challengemeta"><strong>${c.prize}</strong><small>PRIZE POOL</small><button class="button ghost small" onclick='join(${JSON.stringify(c.id)})'>Open ↗</button></div></div>`).join('')}</div><div class="panel"><div class="panelhead"><h2>On the leaderboard</h2><span class="mono">TOP SCORES</span></div>${db.proposals.slice().sort((a,b)=>b.score-a.score).slice(0,4).map((p,i)=>`<div class="rankrow"><div class="rank ${i===0?'first':''}">0${i+1}</div><div><b>${p.title}</b><small>${p.team}</small></div><span class="score">${p.score.toFixed(1)}</span></div>`).join('')}</div></div><h2 class="sectiontitle">Latest activity</h2><div class="panel"><div class="activity"><span class="dot"></span><div><b>${db.proposals[0]?.title||'New idea'}</b> was shortlisted<time>12 minutes ago</time></div></div><div class="activity"><span class="dot" style="background:var(--orange)"></span><div><b>${db.challenges[0]?.title}</b> is now accepting submissions<time>2 hours ago</time></div></div><div class="activity"><span class="dot" style="background:#8db75e"></span><div>New teams joined the community<time>Yesterday</time></div></div></div>`}function challenges(){let list=db.challenges.filter(c=>(filter==='All'||c.category===filter)&&(c.title+' '+c.description).toLowerCase().includes(query.toLowerCase()));return head('FIND YOUR NEXT BIG THING','Open challenges','Big questions deserve brave answers.',user.role==='Administrator'?'<button class="button lime" onclick="modalChallenge()">＋ <span>Create challenge</span></button>':'')+`<div class="toolbar"><input class="field search" placeholder="⌕  Search challenges..." value="${query}" oninput="query=this.value;render()"><select class="field" onchange="filter=this.value;render()"><option>All</option>${[...new Set(db.challenges.map(c=>c.category))].map(x=>`<option ${filter===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="cards">${list.length?list.map(card).join(''):'<div class="panel empty">No challenges match your search.</div>'}</div>`}function submissions(){return head('THE IDEA ARCHIVE','Submissions','Every great change starts with a first draft.',user.role==='Participant'?'<button class="button lime" onclick="modalProposal()">＋ <span>Submit an idea</span></button>':'')+`<div class="panel tablewrap"><table class="table"><thead><tr><th>PROJECT</th><th>CHALLENGE</th><th>TEAM</th><th>SCORE</th><th>STATUS</th></tr></thead><tbody>${db.proposals.map(p=>`<tr><td>${p.title}</td><td>${p.challenge}</td><td>${p.team}</td><td>${p.score.toFixed(1)} / 10</td><td><span class="status ${p.status==='Finalist'?'finalist':p.status==='Under review'?'review':''}">${p.status}</span></td></tr>`).join('')}</tbody></table></div>`}function reviews(){let todo=db.proposals.filter(p=>p.status==='Under review');return head('MAKE IT COUNT','Review queue',`${todo.length} proposals are waiting for thoughtful feedback.`)+`<div class="panel tablewrap"><table class="table"><thead><tr><th>PROJECT</th><th>CHALLENGE</th><th>SUBMITTED BY</th><th>SCORE</th><th>ACTION</th></tr></thead><tbody>${todo.map(p=>`<tr><td>${p.title}</td><td>${p.challenge}</td><td>${p.team}</td><td>${p.score.toFixed(1)}</td><td><button class="button small" onclick='modalReview(${JSON.stringify(p.id)})'>Evaluate ↗</button></td></tr>`).join('')||'<tr><td colspan="5">Everything has been reviewed. Nice work!</td></tr>'}</tbody></table></div>`}function leaderboard(){let rows=db.proposals.slice().sort((a,b)=>b.score-a.score);return head('GOOD IDEAS, GREAT IMPACT','Leaderboard','The teams moving the needle, ranked by reviewer scores.')+`<div class="panel"><div class="panelhead"><h2>All proposals</h2><span class="mono">${rows.length} ENTRIES</span></div>${rows.map((p,i)=>`<div class="rankrow" style="grid-template-columns:34px 1fr minmax(70px,160px) 50px"><div class="rank ${i<3?'first':''}">${String(i+1).padStart(2,'0')}</div><div><b>${p.title}</b><small>${p.team} · ${p.challenge}</small></div><div class="bar"><i style="width:${p.score*10}%"></i></div><span class="score">${p.score.toFixed(1)}</span></div>`).join('')}</div>`}function results(){let rows=db.proposals.filter(p=>p.status==='Finalist'||p.status==='Winner').sort((a,b)=>b.score-a.score);return head('THE MOMENT WE HAVE BEEN WAITING FOR','Final results','Celebrating the people building a brighter next chapter.')+`<div class="cards">${(rows.length?rows:db.proposals.slice().sort((a,b)=>b.score-a.score).slice(0,3)).map((p,i)=>`<article class="challengecard" style="min-height:190px;background:${i===0?'var(--lime)':'var(--white)'}"><div class="eyebrow">${i===0?'✦ GRAND WINNER':`FINALIST 0${i}`}</div><h3>${p.title}</h3><p>${p.team} · ${p.challenge}</p><div class="cardfoot"><span class="tag ${i===0?'green':''}">${p.score.toFixed(1)} / 10</span><span class="mono">${p.status}</span></div></article>`).join('')}</div>${user.role==='Administrator'?`<div class="panel" style="margin-top:18px"><div class="panelhead"><h2>Declare a winner</h2><span class="mono">ADMIN CONTROL</span></div><div style="padding:17px;display:flex;gap:10px;flex-wrap:wrap"><select id="winnerSelect" class="field">${db.proposals.map(p=>`<option value="${p.id}">${p.title} — ${p.score.toFixed(1)}</option>`).join('')}</select><button class="button lime" onclick="declareWinner()">✦ Announce winner</button><select id="finalSelect" class="field">${db.proposals.map(p=>`<option value="${p.id}">${p.title}</option>`).join('')}</select><button class="button ghost" onclick="shortlist()">Shortlist finalist</button></div></div>`:''}`}function team(){return head('YOUR COLLABORATORS','The team','People making the work possible.')+`<div class="cards">${db.users.map(u=>`<article class="challengecard" style="min-height:120px;display:flex;flex-direction:row;align-items:center;gap:13px"><div class="avatar">${initials(u.name)}</div><div><b>${u.name}</b><p>${u.role} · ${u.email}</p></div><span class="tag" style="margin-left:auto">ACTIVE</span></article>`).join('')}</div>`}function settings(){return head('MAKE IT YOURS','Settings','Your workspace, your way.')+`<div class="panel" style="padding:22px;max-width:600px"><div class="formgroup"><label>Display name</label><input class="field" id="setName" value="${user.name}"></div><div class="formgroup" style="margin-top:14px"><label>Workspace role</label><select class="field" id="setRole">${['Administrator','Participant','Reviewer'].map(r=>`<option ${user.role===r?'selected':''}>${r}</option>`).join('')}</select></div><button class="button lime" style="margin-top:17px" onclick="saveSettings()">Save changes</button><p class="mono" style="margin-top:19px">YOUR WORK IS SAVED IN THIS BROWSER.</p></div>`}function render(){let pages={Overview:overview,Challenges:challenges,Submissions:submissions,Reviews:reviews,Leaderboard:leaderboard,Results:results,Team:team,Settings:settings};app.innerHTML=shell((pages[page]||overview)())}
function modal(title,body){let b=document.createElement('div');b.className='modalback';b.innerHTML=`<div class="modal"><div class="modalhead"><h2>${title}</h2><button class="close" onclick="this.closest('.modalback').remove()">×</button></div>${body}</div>`;b.addEventListener('click',e=>{if(e.target===b)b.remove()});document.body.append(b);return b}function modalChallenge(){modal('Start a challenge',`<form onsubmit="createChallenge(event)"><div class="formgrid"><div class="formgroup full"><label>Challenge title</label><input required class="field" name="title" placeholder="A question worth solving"></div><div class="formgroup"><label>Category</label><select class="field" name="category"><option>Sustainability</option><option>Healthcare</option><option>Finance</option><option>Education</option><option>Technology</option><option>Community</option></select></div><div class="formgroup"><label>Deadline</label><input required type="date" class="field" name="deadline"></div><div class="formgroup"><label>Prize pool</label><input class="field" name="prize" placeholder="₹50,000"></div><div class="formgroup"><label>Status</label><select class="field" name="status"><option>Open</option><option>Coming soon</option></select></div><div class="formgroup full"><label>Challenge brief</label><textarea required class="field" name="description" placeholder="What problem should participants solve?"></textarea></div></div><button class="button lime" style="margin-top:18px">Create challenge ↗</button></form>`)}function createChallenge(e){e.preventDefault();let f=new FormData(e.target);db.challenges.unshift({id:Date.now(),title:f.get('title'),category:f.get('category'),deadline:f.get('deadline'),prize:f.get('prize')||'Prize TBA',status:f.get('status'),description:f.get('description'),participants:0,criteria:seed.challenges[0].criteria});save();document.querySelector('.modalback').remove();toast('Challenge published to your workspace');render()}function modalProposal(){modal('Put your idea out there',`<form onsubmit="createProposal(event)"><div class="formgrid"><div class="formgroup full"><label>Project title</label><input required class="field" name="title" placeholder="Give your idea a name"></div><div class="formgroup full"><label>Challenge</label><select class="field" name="challenge">${db.challenges.filter(c=>c.status==='Open').map(c=>`<option>${c.title}</option>`).join('')}</select></div><div class="formgroup full"><label>The problem</label><textarea required class="field" name="problem" placeholder="What needs to change?"></textarea></div><div class="formgroup full"><label>Your solution</label><textarea required class="field" name="solution" placeholder="How will your idea make a difference?"></textarea></div><div class="formgroup full"><label>Supporting file (optional)</label><input class="field" type="file" accept=".pdf,.ppt,.pptx,.doc,.docx"></div></div><button class="button lime" style="margin-top:18px">Submit proposal ↗</button></form>`)}function createProposal(e){e.preventDefault();let f=new FormData(e.target);db.proposals.unshift({id:Date.now(),title:f.get('title'),team:user.name,challenge:f.get('challenge'),status:'Under review',score:0,innovation:f.get('problem'),solution:f.get('solution')});save();document.querySelector('.modalback').remove();toast('Your proposal is in — good luck!');go('Submissions')}function modalReview(id){let p=db.proposals.find(x=>x.id===id);modal('A considered review',`<form onsubmit="submitReview(event,${id})"><p class="mono">${p.title} · ${p.team}</p><p style="font-size:12px;line-height:1.6">${p.innovation||p.solution}</p><div class="formgrid">${['Innovation','Feasibility','Technical implementation','Problem solving','Potential impact'].map((x,i)=>`<div class="formgroup"><label>${x} · ${[30,20,20,15,15][i]}%</label><input required type="number" min="1" max="10" value="8" class="field" name="s${i}"></div>`).join('')}<div class="formgroup full"><label>Feedback for the team</label><textarea class="field" name="feedback" placeholder="Be specific, constructive, and kind."></textarea></div></div><button class="button lime" style="margin-top:18px">Submit evaluation ↗</button></form>`)}function submitReview(e,id){e.preventDefault();let f=new FormData(e.target),s=[0,1,2,3,4].map(i=>+f.get('s'+i)),score=(s[0]*.3+s[1]*.2+s[2]*.2+s[3]*.15+s[4]*.15);let p=db.proposals.find(x=>x.id===id);p.score=score;p.status='Reviewed';db.reviews.push({proposal:id,reviewer:user.name,scores:s,feedback:f.get('feedback')});save();document.querySelector('.modalback').remove();toast(`Evaluation saved · weighted score ${score.toFixed(2)}`);render()}function join(id){let c=db.challenges.find(x=>x.id===id);if(user.role==='Administrator'){modal(c.title,`<p>${c.description}</p><p class="mono">${c.participants} PARTICIPANTS · DEADLINE ${c.deadline}</p><div style="display:flex;gap:8px"><button class="button ghost" onclick="editChallenge(${id})">Edit</button><button class="button" onclick="toggleChallenge(${id})">${c.status==='Open'?'Unpublish':'Publish'}</button><button class="button" style="background:var(--orange)" onclick="deleteChallenge(${id})">Delete</button></div>`)}else if(user.role==='Reviewer'){go('Reviews')}else{if(!c.registeredBy)c.registeredBy=[];if(c.registeredBy.includes(user.email)){toast('You are already registered for this challenge.');return}c.registeredBy.push(user.email);c.participants++;save();toast(`You joined ${c.title}!`);render()}}function editChallenge(id){document.querySelector('.modalback')?.remove();let c=db.challenges.find(x=>x.id===id);modal('Edit challenge',`<form onsubmit="updateChallenge(event,${id})"><div class="formgrid"><div class="formgroup full"><label>Title</label><input required class="field" name="title" value="${c.title}"></div><div class="formgroup"><label>Category</label><input class="field" name="category" value="${c.category}"></div><div class="formgroup"><label>Deadline</label><input type="date" class="field" name="deadline" value="${c.deadline}"></div><div class="formgroup"><label>Prize</label><input class="field" name="prize" value="${c.prize}"></div><div class="formgroup"><label>Status</label><select class="field" name="status"><option ${c.status==='Open'?'selected':''}>Open</option><option ${c.status==='Coming soon'?'selected':''}>Coming soon</option><option ${c.status==='Closed'?'selected':''}>Closed</option></select></div><div class="formgroup full"><label>Description</label><textarea class="field" name="description">${c.description}</textarea></div></div><button class="button lime" style="margin-top:18px">Save changes</button></form>`)}function updateChallenge(e,id){e.preventDefault();let c=db.challenges.find(x=>x.id===id),f=new FormData(e.target);for(let k of ['title','category','deadline','prize','status','description'])c[k]=f.get(k);save();document.querySelector('.modalback').remove();toast('Challenge updated');render()}function toggleChallenge(id){let c=db.challenges.find(x=>x.id===id);c.status=c.status==='Open'?'Closed':'Open';save();document.querySelector('.modalback').remove();toast(`Challenge ${c.status.toLowerCase()}`);render()}function deleteChallenge(id){if(confirm('Delete this challenge?')){db.challenges=db.challenges.filter(c=>c.id!==id);save();document.querySelector('.modalback').remove();toast('Challenge deleted');render()}}function declareWinner(){let p=db.proposals.find(x=>x.id==document.getElementById('winnerSelect').value);db.proposals.forEach(x=>{if(x.status==='Winner')x.status='Finalist'});p.status='Winner';db.proposals.filter(x=>x.id!==p.id&&x.status==='Submitted').forEach(x=>x.status='Finalist');save();toast(`${p.title} is the winner!`);render()}function shortlist(){let p=db.proposals.find(x=>x.id==document.getElementById('finalSelect').value);p.status='Finalist';save();toast(`${p.title} shortlisted`);render()}function saveSettings(){user.name=document.getElementById('setName').value||user.name;user.role=document.getElementById('setRole').value;sessionStorage.setItem('innovatex_user',JSON.stringify(user));toast('Settings saved');render()}function logout(){sessionStorage.removeItem('innovatex_user');modal('Welcome to InnovateX',`<p>Choose a demo account to explore the workspace.</p><div class="formgroup"><label>Sign in as</label><select class="field" id="demoRole"><option>Administrator</option><option>Participant</option><option>Reviewer</option></select></div><button class="button lime" style="margin-top:15px" onclick="loginDemo()">Continue ↗</button>`)}function loginDemo(){let role=document.getElementById('demoRole').value;user=role==='Administrator'?{name:'Alex Morgan',role,email:'admin@demo.com'}:role==='Participant'?{name:'Aarav Mehta',role,email:'aarav@demo.com'}:{name:'Dr. Anika Bose',role,email:'anika@demo.com'};sessionStorage.setItem('innovatex_user',JSON.stringify(user));document.querySelector('.modalback').remove();page='Overview';render();toast(`Welcome back, ${user.name.split(' ')[0]}`)}render();
</script><script src="api-bridge.js"></script></body></html>
